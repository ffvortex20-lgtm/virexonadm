<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXAMODS - Painel de Keys VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(-45deg, #050508, #110d28, #1a0826, #090e1a);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass {
            background: rgba(18, 16, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(168, 85, 247, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.25);
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        .neon-glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
        }

        .neon-glow-green {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 12, 33, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.7);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-4xl w-full space-y-6 animate__animated animate__fadeIn">
        
        <!-- Cabeçalho -->
        <header class="glass p-6 rounded-3xl neon-glow flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="z-10 text-center md:text-left">
                <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-indigo-400 flex items-center justify-center md:justify-start gap-3">
                    <i class="fa-solid fa-shield-halved text-purple-400 animate__animated animate__pulse animate__infinite"></i> FIXAMODS VIP
                </h1>
                <p class="text-xs text-gray-400 mt-1 flex items-center gap-2 justify-center md:justify-start">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span> Painel de Controle Firebase
                </p>
            </div>

            <div class="flex gap-3 w-full md:w-auto z-10">
                <button onclick="playClickSound(); deleteAllData();" class="flex-1 md:flex-none bg-red-600/80 hover:bg-red-500 active:scale-95 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition duration-200 neon-glow-red flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Limpar Firebase
                </button>
                <button onclick="playClickSound(); loadKeys();" class="flex-1 md:flex-none bg-purple-600/80 hover:bg-purple-500 active:scale-95 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition duration-200 neon-glow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Atualizar
                </button>
            </div>
        </header>

        <!-- Formulário de Geração de Keys em Massa -->
        <section class="glass p-6 md:p-8 rounded-3xl space-y-6 relative">
            <div class="flex items-center justify-between border-b border-purple-500/20 pb-4">
                <h2 class="text-xl font-bold text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-yellow-400"></i> Gerador de Keys em Massa
                </h2>
                <span class="text-xs text-purple-400 font-mono bg-purple-900/40 px-3 py-1 rounded-full border border-purple-500/30">Auto-Format</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-2">Prefixo da Key</label>
                    <div class="relative">
                        <input type="text" id="prefix" value="FIXA-" class="w-full bg-gray-950/80 border border-purple-500/30 focus:border-purple-500 rounded-xl px-4 py-3 text-sm font-mono text-purple-300 focus:outline-none transition pl-10">
                        <i class="fa-solid fa-tag absolute left-3.5 top-3.5 text-gray-500 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-2">Quantidade de Keys</label>
                    <div class="relative">
                        <input type="number" id="quantity" value="5" min="1" max="100" class="w-full bg-gray-950/80 border border-purple-500/30 focus:border-purple-500 rounded-xl px-4 py-3 text-sm font-mono text-white focus:outline-none transition pl-10">
                        <i class="fa-solid fa-layer-group absolute left-3.5 top-3.5 text-gray-500 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-2">Validade (Dias)</label>
                    <div class="relative">
                        <input type="number" id="days" value="30" min="1" class="w-full bg-gray-950/80 border border-purple-500/30 focus:border-purple-500 rounded-xl px-4 py-3 text-sm font-mono text-white focus:outline-none transition pl-10">
                        <i class="fa-solid fa-calendar-days absolute left-3.5 top-3.5 text-gray-500 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-2">Qtd. Dispositivos</label>
                    <div class="relative">
                        <input type="number" id="maxDevices" value="1" min="1" max="999" class="w-full bg-gray-950/80 border border-purple-500/30 focus:border-purple-500 rounded-xl px-4 py-3 text-sm font-mono text-white focus:outline-none transition pl-10">
                        <i class="fa-solid fa-mobile-screen absolute left-3.5 top-3.5 text-gray-500 text-xs"></i>
                    </div>
                </div>
            </div>

            <button onclick="playClickSound(); generateKeys();" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:opacity-95 active:scale-[0.99] text-white font-extrabold py-3.5 rounded-2xl transition duration-200 neon-glow flex items-center justify-center gap-3 text-base shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i> Gerar e Salvar no Firebase
            </button>
        </section>

        <!-- Lista de Keys Cadastradas -->
        <section class="glass p-6 md:p-8 rounded-3xl space-y-4">
            <div class="flex justify-between items-center border-b border-purple-500/20 pb-4">
                <h2 class="text-xl font-bold text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-database text-pink-400"></i> Keys Ativas
                </h2>
                <span id="key-count" class="text-xs bg-purple-950/80 text-purple-300 font-mono px-3 py-1.5 rounded-full border border-purple-500/40">
                    Carregando...
                </span>
            </div>

            <div id="keys-container" class="space-y-3 max-h-[420px] overflow-y-auto pr-2">
                <p class="text-center text-gray-500 py-10 flex flex-col items-center gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-purple-400"></i>
                    Buscando dados do Firebase...
                </p>
            </div>
        </section>

    </div>

    <!-- Scripts dos Efeitos de Som e Funcionalidades -->
    <script>
        const FIREBASE_URL = "https://levozchats-default-rtdb.firebaseio.com/FIXAMODS_USERS";

        // Efeitos Sonoros com Web Audio API (Sintetizador leve, sem arquivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playDeleteSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Gerar parte aleatória
        function randomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Data de validade (DD-MM-YYYY HH:MM:SS)[span_1](start_span)[span_1](end_span)
        function getFutureDate(days) {
            const date = new Date();
            date.setDate(date.getDate() + parseInt(days));
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
        }

        // Carregar keys do Firebase
        async function loadKeys() {
            const container = document.getElementById('keys-container');
            const icon = document.getElementById('refresh-icon');
            if(icon) icon.classList.add('fa-spin');

            try {
                const response = await fetch(`${FIREBASE_URL}.json`);
                const data = await response.json();
                
                container.innerHTML = '';
                if (!data) {
                    container.innerHTML = `
                        <div class="text-center py-10 space-y-2">
                            <i class="fa-regular fa-folder-open text-4xl text-gray-600"></i>
                            <p class="text-gray-500 font-medium">Nenhuma key cadastrada no banco.</p>
                        </div>`;
                    document.getElementById('key-count').innerText = '0 chaves';
                    return;
                }

                let keysCount = 0;
                Object.keys(data).forEach(keyName => {
                    if (keyName === 'keys') return;
                    keysCount++;
                    
                    const item = data[keyName];
                    const div = document.createElement('div');
                    div.className = "glass-card p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 animate__animated animate__fadeInUp";
                    
                    div.innerHTML = `
                        <div class="space-y-1 w-full md:w-auto">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-mono font-bold text-lg text-purple-300 tracking-wide">${keyName}</span>
                                <button onclick="copyToClipboard('${keyName}')" title="Copiar Key" class="text-gray-400 hover:text-purple-300 transition text-xs">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <span class="text-[10px] font-bold bg-green-500/20 text-green-400 px-2.5 py-0.5 rounded-full border border-green-500/30 uppercase tracking-wider">
                                    ${item.status || 'ACTIVE'}
                                </span>
                            </div>
                            <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-400">
                                <span><i class="fa-regular fa-clock text-purple-400 mr-1"></i> Validade: <strong class="text-gray-200">${item.validity || 'N/A'}</strong></span>
                                <span><i class="fa-solid fa-laptop text-pink-400 mr-1"></i> Dispositivos: <strong class="text-purple-300">${item.maxDevices || 1}</strong></span>
                            </div>
                        </div>

                        <button onclick="playDeleteSound(); deleteKey('${keyName}')" class="w-full md:w-auto bg-red-500/10 hover:bg-red-500/30 text-red-400 px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-red-500/20 flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-trash-can"></i> Deletar
                        </button>
                    `;
                    container.appendChild(div);
                });

                document.getElementById('key-count').innerText = `${keysCount} ${keysCount === 1 ? 'chave' : 'chaves'}`;
            } catch (error) {
                container.innerHTML = '<p class="text-center text-red-400 py-6">Erro de conexão ao carregar dados.</p>';
                console.error(error);
            } finally {
                if(icon) icon.classList.remove('fa-spin');
            }
        }

        // Copiar Key para área de transferência
        function copyToClipboard(text) {
            playClickSound();
            navigator.clipboard.writeText(text);
            alert(`Key enviada para a área de transferência: ${text}`);
        }

        // Gerar Keys em Massa
        async function generateKeys() {
            const prefix = document.getElementById('prefix').value.trim();
            const quantity = parseInt(document.getElementById('quantity').value);
            const days = document.getElementById('days').value;
            const maxDevices = parseInt(document.getElementById('maxDevices').value) || 1;
            
            if (!prefix) {
                alert('Defina um prefixo!');
                return;
            }

            const updates = {};
            const validityDate = getFutureDate(days);

            for (let i = 0; i < quantity; i++) {
                const randomPart = `${randomString(4)}-${randomString(4)}`;
                const keyName = `${prefix}${randomPart}`;
                
                // Estrutura idêntica da foto com suporte para a quantidade customizada de dispositivos[span_2](start_span)[span_2](end_span)
                updates[keyName] = {
                    deviceId: "",
                    keyStatus: "ACTIVE",
                    lastLogin: "",
                    maxDevices: maxDevices,
                    status: "ACTIVE",
                    username: keyName,
                    validity: validityDate,
                    validityMode: "absolute"
                };
            }

            try {
                const response = await fetch(`${FIREBASE_URL}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(updates),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    playSuccessSound();
                    loadKeys();
                } else {
                    alert('Erro ao gravar dados no Firebase.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão com o Firebase.');
            }
        }

        // Deletar Key
        async function deleteKey(keyName) {
            if (!confirm(`Tem certeza que deseja apagar a key ${keyName}?`)) return;
            
            try {
                const response = await fetch(`${FIREBASE_URL}/${keyName}.json`, { method: 'DELETE' });
                if (response.ok) {
                    loadKeys();
                } else {
                    alert('Erro ao apagar key.');
                }
            } catch (error) {
                console.error(error);
            }
        }

        // Deletar Tudo
        async function deleteAllData() {
            if (!confirm('ATENÇÃO: Deseja ZERAR completamente o banco FIXAMODS_USERS? Essa ação não tem volta!')) return;
            
            try {
                const response = await fetch(`${FIREBASE_URL}.json`, { method: 'DELETE' });
                if (response.ok) {
                    playDeleteSound();
                    loadKeys();
                } else {
                    alert('Falha ao deletar banco.');
                }
            } catch (error) {
                console.error(error);
            }
        }

        window.onload = loadKeys;
    </script>
</body>
</html>
