<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gerenciamento - FIXAMODS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <header class="glass p-6 rounded-2xl neon-glow flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                    <i class="fa-solid fa-key mr-2"></i>FIXAMODS PANEL
                </h1>
                <p class="text-xs text-gray-400 mt-1">Gerenciador de Chaves e Acessos</p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="deleteAllData()" class="flex-1 md:flex-none bg-red-600/80 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-semibold transition neon-glow-red flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Limpar Tudo
                </button>
                <button onclick="loadKeys()" class="flex-1 md:flex-none bg-purple-600/80 hover:bg-purple-600 text-white px-4 py-2 rounded-xl text-sm font-semibold transition neon-glow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Atualizar
                </button>
            </div>
        </header>

        <!-- Formulário de Geração em Massa -->
        <section class="glass p-6 rounded-2xl space-y-4">
            <h2 class="text-lg font-bold text-purple-300 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Keys em Massa
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Prefixo da Key (Ex: FIXA-)</label>
                    <input type="text" id="prefix" value="FIXA-" class="w-full bg-gray-900/80 border border-purple-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Quantidade</label>
                    <input type="number" id="quantity" value="5" min="1" max="50" class="w-full bg-gray-900/80 border border-purple-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Validade (Dias)</label>
                    <input type="number" id="days" value="30" min="1" class="w-full bg-gray-900/80 border border-purple-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>
            </div>
            <button onclick="generateKeys()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-3 rounded-xl transition neon-glow flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Gerar e Salvar no Firebase
            </button>
        </section>

        <!-- Lista de Keys Cadastradas -->
        <section class="glass p-6 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-database"></i> Keys no Sistema
                </h2>
                <span id="key-count" class="text-xs bg-purple-900/50 text-purple-300 px-3 py-1 rounded-full border border-purple-500/30">0 chaves</span>
            </div>
            <div id="keys-container" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                <p class="text-center text-gray-500 py-8">Carregando dados do Firebase...</p>
            </div>
        </section>

    </div>

    <script>
        const FIREBASE_URL = "https://levozchats-default-rtdb.firebaseio.com/FIXAMODS_USERS";

        // Gerar string aleatória
        function randomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Formatar data no padrão exato da foto (DD-MM-YYYY HH:MM:SS)[span_2](start_span)[span_2](end_span)
        function getFutureDate(days) {
            const date = new Date();
            date.setDate(date.getDate() + parseInt(days));
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
        }

        // Carregar chaves do Firebase
        async function loadKeys() {
            const container = document.getElementById('keys-container');
            container.innerHTML = '<p class="text-center text-gray-400 py-4"><i class="fa-solid fa-spinner fa-spin"></i> Atualizando...</p>';
            
            try {
                const response = await fetch(`${FIREBASE_URL}.json`);
                const data = await response.json();
                
                container.innerHTML = '';
                if (!data) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-8">Nenhuma key encontrada.</p>';
                    document.getElementById('key-count').innerText = '0 chaves';
                    return;
                }

                let keysCount = 0;
                Object.keys(data).forEach(keyName => {
                    // Ignora nós que não sejam chaves de usuário se houverem
                    if (keyName === 'keys') return;
                    keysCount++;
                    
                    const item = data[keyName];
                    const div = document.createElement('div');
                    div.className = "bg-gray-900/60 border border-purple-500/20 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3";
                    
                    div.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-purple-400">${keyName}</span>
                                <span class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded border border-green-500/30">${item.status || 'ACTIVE'}</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Validade: <span class="text-gray-200">${item.validity || 'N/A'}</span></p>
                            <p class="text-xs text-gray-500">Modo: ${item.validityMode || 'absolute'} | Dispositivos: ${item.maxDevices || 1}</p>
                        </div>
                        <button onclick="deleteKey('${keyName}')" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 px-3 py-1.5 rounded-lg text-xs transition border border-red-500/30 flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> Excluir
                        </button>
                    `;
                    container.appendChild(div);
                });
                document.getElementById('key-count').innerText = `${keysCount} ${keysCount === 1 ? 'chave' : 'chaves'}`;
            } catch (error) {
                container.innerHTML = '<p class="text-center text-red-400 py-4">Erro ao conectar com o Firebase.</p>';
                console.error(error);
            }
        }

        // Gerar Keys em Massa seguindo o padrão exato da foto[span_3](start_span)[span_3](end_span)
        async function generateKeys() {
            const prefix = document.getElementById('prefix').value.trim();
            const quantity = parseInt(document.getElementById('quantity').value);
            const days = document.getElementById('days').value;
            
            if (!prefix) {
                alert('Insira um prefixo válido!');
                return;
            }

            const updates = {};
            const validityDate = getFutureDate(days);

            for (let i = 0; i < quantity; i++) {
                const randomPart = `${randomString(4)}-${randomString(4)}`;
                const keyName = `${prefix}${randomPart}`;
                
                // Estrutura idêntica à apresentada no banco de dados da imagem[span_4](start_span)[span_4](end_span)
                updates[keyName] = {
                    deviceId: "",
                    keyStatus: "ACTIVE",
                    lastLogin: "",
                    maxDevices: 1,
                    status: "ACTIVE",
                    username: keyName,
                    validity: validityDate,
                    validityMode: "absolute"
                };
            }

            try {
                const response = await fetch(`${FIREBASE_URL}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(updates),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    alert(`${quantity} chaves geradas com sucesso!`);
                    loadKeys();
                } else {
                    alert('Erro ao salvar no Firebase.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão ao gerar chaves.');
            }
        }

        // Deletar chave específica
        async function deleteKey(keyName) {
            if (!confirm(`Deseja realmente excluir a chave ${keyName}?`)) return;
            
            try {
                const response = await fetch(`${FIREBASE_URL}/${keyName}.json`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadKeys();
                } else {
                    alert('Erro ao excluir a chave.');
                }
            } catch (error) {
                console.error(error);
            }
        }

        // Apagar todos os dados do banco
        async function deleteAllData() {
            if (!confirm('ATENÇÃO: Deseja apagar TODOS os dados do nó FIXAMODS_USERS? Esta ação não pode ser desfeita!')) return;
            
            try {
                const response = await fetch(`${FIREBASE_URL}.json`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert('Todos os dados foram apagados com sucesso!');
                    loadKeys();
                } else {
                    alert('Erro ao limpar o banco de dados.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão.');
            }
        }

        // Carregar lista ao iniciar a página
        window.onload = loadKeys;
    </script>
</body>
</html>
